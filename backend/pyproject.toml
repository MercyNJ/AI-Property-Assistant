[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# conftest sets env vars before importing the app.
"tests/conftest.py" = ["E402"]
